name: mizan_ksa
version: "1.0.0"
config-version: 2
profile: mizan_ksa

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "logs"]

# Card-scheme dispute monitoring thresholds (owner-approved addition, 2026-11-19).
# A ratio ALONE is noise at small volumes: a merchant with 43 captures and 3 disputes reads 6.98% and means
# nothing. The real programmes therefore require a ratio AND a minimum dispute count, and so does this model.
# These numbers are read from secondary sources (chargeback-industry write-ups), NOT from Visa's or Mastercard's
# own rulebooks, and they move -- Visa replaced its earlier programme in 2025 and cut the merchant line from
# 2.2% to 1.5% in April 2026. They are vars so they can be corrected without touching the model. See HONESTY.md.
vars:
  dispute_ratio_pct_threshold: 1.5    # merchant dispute ratio, percent
  dispute_count_threshold: 100        # minimum disputes in the window before the ratio is judged at all

models:
  mizan_ksa:
    gold:
      +materialized: table   # Gold as tables so Direct Lake never falls back to DirectQuery (spec 5 / rule 3)
      +schema: gld

data_tests:
  mizan_ksa:
    +severity: error

seeds:
  mizan_ksa:
    +schema: gld
    umm_al_qura_calendar:
      +column_types: {calendar_date: date, hijri_year: int, hijri_month: int, hijri_day: int,
                      calendar_version: varchar(32)}
    # Official moon-sighting announcements that differ from the Umm al-Qura table. Empty by default:
    # rows are added when an announcement is published (never invented). Mechanism tested in tests/test_gold_dbt.py.
    # Store reference for the map (owner-approved seed, 2026-11-15): copied unchanged from the generator's
    # data/generated/reference/merchants.csv. 121 rows, no personal data. tests/test_stage2_seed.py guards drift.
    merchant_store_reference:
      +column_types: {merchant_id: varchar(16), store_id: varchar(16), channel: varchar(8), egs_id: varchar(8),
                      city: varchar(32), register_count: int}
    hijri_announcement_overrides:
      +column_types: {hijri_year: int, hijri_month: int, announced_start_date: date,
                      announcement_ref: varchar(200), override_version: varchar(32)}
