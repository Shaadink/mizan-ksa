name: mizan_ksa
version: "1.0.0"
config-version: 2
profile: mizan_ksa

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "logs"]

models:
