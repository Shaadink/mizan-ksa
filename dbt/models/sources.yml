version: 2

# Silver lives in the Lakehouse. On Fabric, dbt reads it by three-part name LH_MIZAN.slv.<table> from WH_MIZAN.
# Locally, dbt-duckdb reads the same Delta tables through delta_scan(external_location).
sources:
  - name: slv_lakehouse
    database: "{{ 'LH_MIZAN' if target.type == 'fabric' else target.database }}"
    schema: slv
    meta:
      external_location: "delta_scan('{{ env_var('MIZAN_LAKE_ROOT', '../data/lake') }}/LH_MIZAN/slv/{name}')"
    tables:
      - name: payment_lifecycle
        columns:
          - name: payment_event_id
            data_tests: [not_null, unique]
          - name: event_type
            data_tests:
              - accepted_values:
                  arguments: {values: ["CAPTURE", "REFUND", "CHARGEBACK"]}
          - name: merchant_id
            data_tests: [not_null]
          - name: business_date_ksa
            data_tests: [not_null]
      - name: settlement_lines
        columns:
          - name: payment_event_id
            data_tests: [not_null, unique]          # contract: ONE row per payment_event_id
          - name: settlement_status
            data_tests:
              - accepted_values:
                  arguments: {values: ["PAID_BANK", "IN_TRANSIT", "QUARANTINED"]}
      - name: erp_gl_journal_lines
        columns:
          - name: gl_account_role
            data_tests:
              - accepted_values:
                  arguments: {values: ["CASH_ON_HAND", "CARD_CLEARING", "REVENUE", "VAT_OUTPUT", "CHARGEBACK_LOSS"]}
          - name: debit_credit
            data_tests:
              - accepted_values:
                  arguments: {values: ["S", "H"]}
      - name: zatca_invoice_documents
        columns:
          - name: invoice_uuid
            data_tests: [not_null, unique]
          - name: invoice_flow
            data_tests:
              - accepted_values:
                  arguments: {values: ["CLEARANCE", "REPORTING"]}
          - name: state
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["CLEARED", "REPORTED", "ACCEPTED_WITH_WARNINGS", "CONFIRMED_REJECTION",
                             "AUTH_HOLD", "UNKNOWN_OUTCOME", "SUBMITTING", "SIGNED"]
      - name: golden_party_scd2
        columns:
          - name: golden_id
            data_tests: [not_null]
          - name: party_type
            data_tests:
              - accepted_values:
                  arguments: {values: ["PERSON", "ORGANIZATION"]}
          - name: status
            data_tests:
              - accepted_values:
                  arguments: {values: ["ACTIVE", "RETIRED"]}
      - name: identifier_registry
        columns:
          - name: id_type
            data_tests:
              - accepted_values:
                  arguments: {values: ["NATIONAL_ID", "IQAMA", "VAT", "UNIFIED_700"]}
          - name: validation_status
            data_tests:
              - accepted_values:
                  arguments: {values: ["VALID_CHECKSUM", "INVALID_CHECKSUM", "VALID_FORMAT", "FORMAT_ONLY",
                                       "INVALID_FORMAT"]}
      - name: entity_merge_ledger
        columns:
          - name: merge_event_id
            data_tests: [not_null, unique]
          - name: action
            data_tests:
              - accepted_values:
                  arguments: {values: ["MERGE", "UNMERGE"]}
      - name: address_observations
        columns:
          - name: observation_id
            data_tests: [not_null, unique]
          - name: format_status
            data_tests:
              - accepted_values:
                  arguments: {values: ["VALID_4L4D", "INVALID_FORMAT"]}

  - name: quarantine_lakehouse
    database: "{{ 'LH_MIZAN' if target.type == 'fabric' else target.database }}"
    schema: quarantine
    meta:
      external_location: "delta_scan('{{ env_var('MIZAN_LAKE_ROOT', '../data/lake') }}/LH_MIZAN/quarantine/{name}')"
    tables:
      - name: mdm_match_conflicts
        columns:
          - name: conflict_id
            data_tests: [not_null, unique]
          - name: status
            data_tests:
              - accepted_values:
                  arguments: {values: ["OPEN", "RESOLVED"]}
          - name: conflict_type
            data_tests:
              - accepted_values:
                  arguments: {values: ["AMBIGUOUS_IDLESS_MATCH", "IDENTIFIER_COLLISION"]}

  - name: meta_lakehouse
    database: "{{ 'LH_MIZAN' if target.type == 'fabric' else target.database }}"
    schema: meta
    meta:
      external_location: "delta_scan('{{ env_var('MIZAN_LAKE_ROOT', '../data/lake') }}/LH_MIZAN/meta/{name}')"
    tables:
      - name: column_classification
        columns:
          - name: classification
            data_tests:
              - accepted_values:
                  arguments: {values: ["PUBLIC", "CONFIDENTIAL", "SECRET", "TOP_SECRET"]}
          - name: legal_hold_class
            data_tests:
              - accepted_values:
                  arguments: {values: ["TAX", "SAMA", "CONSENT"]}
