name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: lint + unit tests + dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,dbt]"
      - name: Ephemeral dev keys (never committed)
        run: python scripts/init_local_env.py
      - name: Ruff
        run: python -m ruff check src tests scripts dags airflow
      - name: Unit tests (Spark tests skip without pyspark)
        run: python -m pytest -q -m "not spark"
      - name: dbt parse (DuckDB target)
        working-directory: dbt
        env:
          MIZAN_DBT_TARGET: duckdb
        run: dbt parse --profiles-dir .

  fabric-app:
    name: Fabric App (type-check + vitest; live DAX shapes = exported Gold)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/command-center
    env:
      RAYFIN_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run

  full:
    name: full suite (PySpark + Delta + dbt-duckdb + residency gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,spark,dbt]"
      - name: Ephemeral dev keys (never committed)
        run: python scripts/init_local_env.py
      - name: Full test suite
        run: python -m pytest -q
