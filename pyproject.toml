[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-ksa"
version = "0.1.0"
description = "Saudi regulated commerce & payments data integrity platform (ZATCA Phase-2, halala reconciliation, PDPL, NDMO) on Microsoft Fabric."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "lxml>=5.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100,<6.136",   # newer builds ship a native DLL that Windows Smart App Control blocks
    "ruff>=0.6",
    "duckdb>=1.0",
]
# dbt: Fabric Warehouse target + local DuckDB test target
dbt = [
    "dbt-core>=1.9,<1.11",
    "dbt-fabric>=1.9,<1.10",
    "dbt-duckdb>=1.9,<1.11",
]
# Fabric Runtime 1.3 parity: Spark 3.5 + Delta 3.2
spark = [
    "pyspark>=3.5.3,<3.6",
    "delta-spark>=3.2,<3.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["spark: needs local PySpark + Delta (portable JDK in .tools)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF005"]  # assert is the pytest idiom; list concat is fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"src/mizan/generator/**" = ["S311"]  # seeded, deterministic synthetic data - not crypto
"src/mizan/generator/catalog.py" = ["S311", "E501"]  # escaped Arabic literals are long
"src/mizan/common/saudi_ids.py" = ["S311"]
